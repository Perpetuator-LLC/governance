# ONE workflow, one run per commit: with two, "is it green?" reads whichever run the asker found.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runner images differ in what they ship. Install what the suites import, then ASSERT it: a
      # dependency step that "succeeds" without installing anything makes the next step fail with an
      # unreadable error far from its cause.
      - name: Install test dependencies
        run: |
          set -euo pipefail
          if ! python3 -c 'import yaml' 2>/dev/null; then
            if command -v apt-get >/dev/null 2>&1; then
              SUDO=""; [ "$(id -u)" = 0 ] || SUDO="sudo"
              $SUDO apt-get update -qq && $SUDO apt-get install -y -qq python3-yaml
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache py3-yaml
            fi
          fi
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'
          command -v git >/dev/null || { echo "::error::git missing"; exit 1; }

      - name: Parse-check every script
        run: |
          set -euo pipefail
          n=0
          for f in tests/*.test.sh hooks/*.sh; do bash -n "$f"; n=$((n + 1)); done
          # bin/ holds both bash and python. Choose the parser by SHEBANG: parsing a bash script as
          # python fails, and skipping what is not python would pass having checked nothing. An
          # unrecognised shebang is an error, never a silent skip.
          for f in bin/*; do
            [ -f "$f" ] || continue
            head1="$(head -n 1 "$f")"
            case "$head1" in
              '#!'*python*) python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f" ;;
              '#!'*bash*|'#!'*/sh|'#!'*' sh') bash -n "$f" ;;
              *) echo "::error file=$f::no bash or python shebang; cannot choose a parser"; exit 1 ;;
            esac
            n=$((n + 1))
          done
          echo "parse-checked $n file(s)"
          # An empty glob would pass having checked nothing. Raise when files are added; never lower.
          [ "$n" -ge 30 ] || { echo "::error::only $n files parse-checked, expected >= 30; discovery is broken"; exit 1; }

      # REDACTION GATE. Two legs. The SHAPE leg needs no secret and always runs. The PRIVATE-NAME leg
      # needs the maintainers' inventory of instance names, supplied as an Actions secret; it is
      # deliberately NOT available to pull_request runs (a PR author controls the code that would
      # read it), so on a PR the leg reports NOT CHECKED (exit 3) and the push-to-main run is the
      # one that must pass it. A missing secret on main is a FAILURE, never a clean scan.
      - name: Redaction gate (shape leg on every run; private-name leg on main)
        env:
          GOVERNANCE_PRIVATE_PATTERNS_CONTENT: ${{ secrets.GOVERNANCE_PRIVATE_PATTERNS }}
        run: |
          # The runner executes this under `bash -e`: a bare `cmd; rc=$?` aborts before rc is read.
          set -uo pipefail
          files=$(git ls-files | grep -vE '^tests/redaction-check\.test\.sh$' | grep -E '\.(md|sh|py|json|ya?ml)$|^bin/|^hooks/')
          if [ -n "${GOVERNANCE_PRIVATE_PATTERNS_CONTENT:-}" ]; then
            umask 077; tmp=$(mktemp); printf '%s\n' "$GOVERNANCE_PRIVATE_PATTERNS_CONTENT" > "$tmp"
            rc=0; python3 bin/redaction-check --enforce --private-patterns "$tmp" $files || rc=$?; rm -f "$tmp"
          else
            rc=0; python3 bin/redaction-check --enforce $files || rc=$?
          fi
          echo "redaction-check exit $rc (0 clean · 1 findings · 2 cannot run · 3 private leg not checked)"
          case "$rc" in
            0) ;;
            3) if [ "${{ github.event_name }}" = "push" ]; then
                 echo "::error::private-name leg NOT CHECKED on main — the GOVERNANCE_PRIVATE_PATTERNS secret is missing or unreadable"; exit 1
               else
                 echo "::notice::private-name leg not checked on a pull request (by design); it runs on the push to main"; fi ;;
            *) exit 1 ;;
          esac

      - name: Test suite
        run: |
          set -euo pipefail
          shopt -s nullglob
          suites=(tests/*.test.sh)
          echo "discovered ${#suites[@]} suite(s)"
          # ASSERT THE COUNT, NOT JUST THE EXIT CODE: a runner that discovers zero suites exits 0
          # forever. Raise the floor when suites are added; never lower it to make a run pass.
          if [ "${#suites[@]}" -lt 18 ]; then
            echo "::error::only ${#suites[@]} suites discovered, expected >= 13"
            exit 1
          fi
          fails=0
          for t in "${suites[@]}"; do
            echo "── $t"
            if bash "$t"; then :; else
              echo "::error file=$t::suite failed"
              fails=$((fails + 1))
            fi
          done
          echo "ran ${#suites[@]} suite(s), $fails failed"
          [ "$fails" -eq 0 ]
