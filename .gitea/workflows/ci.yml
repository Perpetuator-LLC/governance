# ONE workflow, one run per commit: with two, "is it green?" reads whichever run the asker found.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse-check every script
        run: |
          set -euo pipefail
          n=0
          for f in tests/*.test.sh; do bash -n "$f"; n=$((n + 1)); done
          for f in bin/*; do
            python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f"; n=$((n + 1))
          done
          echo "parse-checked $n file(s)"
          # An empty glob would pass having checked nothing.
          [ "$n" -ge 6 ] || { echo "::error::only $n files parse-checked; discovery is broken"; exit 1; }

      - name: Test suite
        run: |
          set -euo pipefail
          shopt -s nullglob
          suites=(tests/*.test.sh)
          echo "discovered ${#suites[@]} suite(s)"
          # ASSERT THE COUNT, NOT JUST THE EXIT CODE: a runner that discovers zero suites exits 0
          # forever. Raise the floor when suites are added; never lower it to make a run pass.
          if [ "${#suites[@]}" -lt 3 ]; then
            echo "::error::only ${#suites[@]} suites discovered, expected >= 3"
            exit 1
          fi
          fails=0
          for t in "${suites[@]}"; do
            echo "── $t"
            if bash "$t"; then :; else
              echo "::error file=$t::suite failed"
              fails=$((fails + 1))
            fi
          done
          echo "ran ${#suites[@]} suite(s), $fails failed"
          [ "$fails" -eq 0 ]
