# The repository's one gate. A status-gated pull deployer reads "no status" as "not green" and waits
# forever, so this must report on the default branch BEFORE anything deploys from the repository.
name: ci

on:
  # Every branch: the default branch gets a status whatever it is named, and a pull request's head
  # is a pushed commit, so it is covered without a second, twin run on the same commit.
  push:
    branches: ['**']

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the secret scan reads every commit, not only the tip

      # Runner images differ in what they ship. Install from the OS package channel, then ASSERT:
      # a step that "succeeds" without installing anything fails the next one far from its cause.
      - name: Install lint tools (OS packages)
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1 || ! command -v yamllint >/dev/null 2>&1; then
            SUDO=""; [ "$(id -u)" = 0 ] || SUDO="sudo"
            $SUDO apt-get update -qq
            $SUDO apt-get install -y -qq shellcheck yamllint
          fi
          shellcheck --version | sed -n 2p
          yamllint --version
          for tool in git curl sha256sum tar awk find install; do
            command -v "$tool" >/dev/null || { echo "::error::$tool missing on the runner"; exit 1; }
          done

      # SECRET SCANNER — installing it is a supply-chain decision. The vendor's own release only (no
      # third-party action, no mirror, no curl | sh), an exact version, and a checksum that must equal
      # BOTH the vendor's checksums file from that same release AND the digest pinned below. The pin
      # refuses a release re-published later with a new checksums file to match. To upgrade, change
      # the version and both digests together, reading the digests from that release's checksums file.
      - name: Install secret scanner (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256_LINUX_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_SHA256_LINUX_ARM64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)        arch=x64;   pinned="$GITLEAKS_SHA256_LINUX_X64" ;;
            aarch64|arm64) arch=arm64; pinned="$GITLEAKS_SHA256_LINUX_ARM64" ;;
            *) echo "::error::no pinned secret-scanner digest for $(uname -m)"; exit 1 ;;
          esac
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          work="$(mktemp -d)"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/$tarball" "$base/$tarball"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/$sums" "$base/$sums"
          published="$(awk -v f="$tarball" '$2 == f { print $1 }' "$work/$sums")"
          actual="$(sha256sum "$work/$tarball" | awk '{ print $1 }')"
          [ -n "$published" ] || { echo "::error::$tarball is not listed in the vendor checksums file"; exit 1; }
          [ "$actual" = "$published" ] || { echo "::error::$tarball does not match the vendor checksums file"; exit 1; }
          [ "$actual" = "$pinned" ] || { echo "::error::$tarball does not match the digest pinned in this workflow"; exit 1; }
          mkdir -p "$work/unpacked" "$HOME/.local/bin"
          tar -xzf "$work/$tarball" -C "$work/unpacked"
          binary="$(find "$work/unpacked" -type f -name gitleaks | head -n 1)"
          [ -n "$binary" ] || { echo "::error::no gitleaks binary inside $tarball"; exit 1; }
          install -m 0755 "$binary" "$HOME/.local/bin/gitleaks"
          [ "$("$HOME/.local/bin/gitleaks" version)" = "$GITLEAKS_VERSION" ] || { echo "::error::installed scanner reports the wrong version"; exit 1; }
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "secret scanner $GITLEAKS_VERSION installed, checksum verified ($arch)"

      - name: Secret scan (every commit)
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .

      # An empty file list lints nothing and exits 0; assert the list is non-empty.
      - name: Shell and YAML lint
        run: |
          set -euo pipefail
          mapfile -t shell_files < <(git ls-files '*.sh')
          mapfile -t yaml_files < <(git ls-files '*.yml' '*.yaml')
          [ "${#shell_files[@]}" -ge 1 ] || { echo "::error::no shell files found; discovery is broken"; exit 1; }
          [ "${#yaml_files[@]}" -ge 1 ] || { echo "::error::no YAML files found; discovery is broken"; exit 1; }
          shellcheck -x "${shell_files[@]}"
          yamllint -d relaxed "${yaml_files[@]}"
          echo "linted ${#shell_files[@]} shell and ${#yaml_files[@]} YAML file(s)"

      # The repository's gates and the module's own tests. Among them the MODULE LINT (module/ names
      # nothing from overlay/lint-denylist.txt, no checkout path, no path into overlay/ — NOT CHECKED,
      # exit 3, until that denylist exists) and the EMPTY-INPUTS test (the module starts with no core
      # input set). NOT CHECKED fails this step: it is never a pass.
      - name: Tests (gates, module lint, module tests)
        run: |
          set -euo pipefail
          shopt -s nullglob
          suites=(tests/*.test.sh module/tests/*.test.sh)
          echo "discovered ${#suites[@]} suite(s)"
          # ASSERT THE COUNT, NOT JUST THE EXIT CODE: a runner that discovers zero suites exits 0
          # forever. Raise the floor when suites are added; never lower it to make a run pass.
          if [ "${#suites[@]}" -lt 4 ]; then
            echo "::error::only ${#suites[@]} suite(s) discovered, expected >= 4"
            exit 1
          fi
          fails=0
          for t in "${suites[@]}"; do
            echo "── $t"
            if bash "$t"; then :; else
              echo "::error file=$t::suite failed"
              fails=$((fails + 1))
            fi
          done
          echo "ran ${#suites[@]} suite(s), $fails failed"
          [ "$fails" -eq 0 ]
